<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1100" viewBox="0 0 560 1100" role="img" aria-labelledby="title desc"><title id="title">Daily · публикация и повторы</title><desc id="desc">Успех планировщика ≠ публикация.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#e21b16" stroke-width="1.5"/></marker></defs><rect width="560" height="1100" fill="#fff"/><g font-family="Onest,Arial,sans-serif" fill="#0b0b0b"><text x="68" y="46" font-size="24" font-weight="700">Daily · публикация и повторы</text><polyline points="280,178 280,231" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><polyline points="280,331 280,384" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><polyline points="280,484 280,537" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><polyline points="68,128 38,128 38,784 68,784" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><polyline points="492,587 524,587 524,948 492,948" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><g><rect x="68" y="78" width="424" height="100" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="88" y="120" font-size="26" font-weight="700">Собрать + проверить</text><text x="88" y="160" font-size="22">Пакет News и данные выпуска</text></g><g><rect x="68" y="231" width="424" height="100" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="88" y="273" font-size="26" font-weight="700">Технический этап</text><text x="88" y="313" font-size="22">Медиа · подтверждение источника</text></g><g><rect x="68" y="384" width="424" height="100" rx="7" fill="#fff0ed" stroke="#e21b16" stroke-width="2"/><text x="88" y="426" font-size="26" font-weight="700">Опубликовать</text><text x="88" y="466" font-size="22">Выпуск становится доступен</text></g><g><rect x="68" y="537" width="424" height="100" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="88" y="579" font-size="26" font-weight="700">Уведомить</text><text x="88" y="619" font-size="22">Сохранённое подтверждение Discord</text></g><g><rect x="68" y="728" width="424" height="112" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="88" y="770" font-size="26" font-weight="700">Сбой до публикации</text><text x="88" y="810" font-size="22">Та же попытка; News не собирать</text></g><g><rect x="68" y="892" width="424" height="112" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="88" y="934" font-size="26" font-weight="700">Сбой уведомления</text><text x="88" y="974" font-size="22">Выпуск есть; повторить уведомление</text></g><text x="68" y="1065" font-size="20" fill="#5e5e59">Успех планировщика ≠ публикация.</text></g></svg>
