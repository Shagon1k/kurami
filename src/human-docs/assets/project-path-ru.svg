<svg xmlns="http://www.w3.org/2000/svg" width="560" height="982" viewBox="0 0 560 982" role="img" aria-labelledby="title desc"><title id="title">Путь инженерной задачи</title><desc id="desc">Слияние и развёртывание — всегда твоё решение. Если что-то неясно, запуск останавливается и ждёт.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#e21b16" stroke-width="1.5"/></marker></defs><rect width="560" height="982" fill="#fff"/><g font-family="Onest,Arial,sans-serif" fill="#0b0b0b"><text x="42" y="46" font-size="23" font-weight="700">Путь инженерной задачи</text><polyline points="280,166 280,186" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/><polyline points="280,284 280,304" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/><polyline points="280,402 280,422" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/><polyline points="280,520 280,540" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/><polyline points="280,638 280,658" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/><polyline points="280,756 280,776" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/><g><rect x="42" y="70" width="476" height="96" rx="7" fill="#fff0ed" stroke="#e21b16" stroke-width="2"/><text x="60" y="104" font-size="22" font-weight="700" fill="#e21b16">Ты</text><text x="60" y="144" font-size="25">Переводишь задачу в работу</text></g><g><rect x="42" y="188" width="476" height="96" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="60" y="222" font-size="22" font-weight="700" fill="#5e5e59">Hermes и Курами</text><text x="60" y="262" font-size="25">Опрос доски замечает переход</text></g><g><rect x="42" y="306" width="476" height="96" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="60" y="340" font-size="22" font-weight="700" fill="#5e5e59">Курами: допуск</text><text x="60" y="380" font-size="25">Задача, описание, лимиты, ресурсы</text></g><g><rect x="42" y="424" width="476" height="96" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="60" y="458" font-size="22" font-weight="700" fill="#5e5e59">Курами: контроллер</text><text x="60" y="498" font-size="25">Своя ветка и рабочая копия</text></g><g><rect x="42" y="542" width="476" height="96" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="60" y="576" font-size="22" font-weight="700" fill="#5e5e59">Codex</text><text x="60" y="616" font-size="25">Пишет код и открывает PR</text></g><g><rect x="42" y="660" width="476" height="96" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="60" y="694" font-size="22" font-weight="700" fill="#5e5e59">Курами</text><text x="60" y="734" font-size="25">CI и ревью на точном коммите</text></g><g><rect x="42" y="778" width="476" height="96" rx="7" fill="#fff0ed" stroke="#e21b16" stroke-width="2"/><text x="60" y="812" font-size="22" font-weight="700" fill="#e21b16">Ты</text><text x="60" y="852" font-size="25">Смотришь PR и решаешь сам</text></g><text x="42" y="934" font-size="20" fill="#5e5e59">Слияние и развёртывание — всегда твоё решение.</text><text x="42" y="968" font-size="20" fill="#5e5e59">Если что-то неясно, запуск останавливается и ждёт.</text></g></svg>
