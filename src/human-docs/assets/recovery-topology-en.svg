<svg xmlns="http://www.w3.org/2000/svg" width="560" height="940" viewBox="0 0 560 940" role="img" aria-labelledby="title desc"><title id="title">Recovery · sources and boundaries</title><desc id="desc">Old IDs and preview ports are not restored.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#e21b16" stroke-width="1.5"/></marker></defs><rect width="560" height="940" fill="#fff"/><g font-family="Onest,Arial,sans-serif" fill="#0b0b0b"><text x="40" y="55" font-size="25" font-weight="700">Recovery · sources and boundaries</text><polyline points="150,235 150,515" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><polyline points="410,235 410,290" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><polyline points="300,195 280,195 280,515" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><polyline points="410,445 410,515" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><polyline points="150,640 150,700" fill="none" stroke="#e21b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><g><rect x="40" y="90" width="220" height="145" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="55" y="133" font-size="22" font-weight="700">Private Git</text><text x="55" y="169" font-size="22">Code · tests</text><text x="55" y="199" font-size="22">Deploy assets</text></g><g><rect x="300" y="90" width="220" height="145" rx="7" fill="#faf8f2" stroke="#0b0b0b" stroke-width="2"/><text x="315" y="133" font-size="22" font-weight="700">Local backup</text><text x="315" y="169" font-size="22">SQLite · config</text><text x="315" y="199" font-size="22">Manifest checked</text></g><g><rect x="3