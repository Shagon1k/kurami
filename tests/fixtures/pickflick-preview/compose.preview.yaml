x-build: &build
    context: .
    dockerfile: Dockerfile
    args:
        SOURCE_REVISION: ${SOURCE_REVISION:?SOURCE_REVISION must be the exact CI SHA}

x-application-service: &application-service
    cap_drop:
        - ALL
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
        - no-new-privileges:true
    stop_grace_period: 15s
    stop_signal: SIGTERM
    tmpfs:
        - /tmp

x-runtime-environment: &runtime-environment
    APP_ENV: uat
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    STORAGE_ENDPOINT: http://minio:9000
    STORAGE_REGION: us-east-1
    STORAGE_BUCKET: pickflick-preview
    STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
    STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    STORAGE_FORCE_PATH_STYLE: 'true'
    RESEND_DELIVERY_MODE: preview
    RESEND_API_KEY: preview-disabled
    RESEND_FROM: PickFlick UAT <notifications@uat.pick-flick.app>
    CONTACT_DELIVERY_TO: contact@example.invalid

services:
    postgres:
        image: postgres:17.6-alpine
        environment:
            POSTGRES_DB: pickflick
            POSTGRES_USER: pickflick
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
        ports:
            - '127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 3s
            timeout: 3s
            retries: 20

    minio:
        image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
        command: ['server', '/data', '--console-address', ':9001']
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
        ports:
            - '127.0.0.1:${MINIO_API_PORT:?MINIO_API_PORT is required}:9000'
            - '127.0.0.1:${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}:9001'
        volumes:
            - minio-data:/data
        healthcheck:
            test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:9000/minio/health/live']
            interval: 3s
            timeout: 3s
            retries: 20

    minio-init:
        image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
        entrypoint:
            [
                '/bin/sh',
                '-ec',
                'mc alias set -- local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/pickflick-preview',
            ]
        restart: 'no'

    release:
        <<: *application-service
        build:
            <<: *build
            target: release
        environment:
            APP_ENV: uat
            DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'

    backend:
        <<: *application-service
        build:
            <<: *build
            target: backend
        environment:
            <<: *runtime-environment
            BACKEND_HOST: 0.0.0.0
            BACKEND_PORT: 3001
            AUTH_BASE_URL: ${AUTH_BASE_URL:?AUTH_BASE_URL is required}
            AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
            APPLE_SIGN_IN_ENABLED: ${APPLE_SIGN_IN_ENABLED:-false}
            APPLE_CLIENT_ID: '${APPLE_CLIENT_ID:-}'
            APPLE_KEY_ID: '${APPLE_KEY_ID:-}'
            APPLE_PRIVATE_KEY: '${APPLE_PRIVATE_KEY:-}'
            APPLE_TEAM_ID: '${APPLE_TEAM_ID:-}'
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
        depends_on:
            postgres:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
            release:
                condition: service_completed_successfully
        ports:
            - '127.0.0.1:${PREVIEW_BACKEND_PORT:?PREVIEW_BACKEND_PORT is required}:3001'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 20

    frontend:
        <<: *application-service
        build:
            <<: *build
            target: frontend
            args:
                SOURCE_REVISION: ${SOURCE_REVISION:?SOURCE_REVISION must be the exact CI SHA}
                BACKEND_INTERNAL_URL: http://backend:3001
        environment:
            APPLE_SIGN_IN_ENABLED: ${APPLE_SIGN_IN_ENABLED:-false}
            BACKEND_INTERNAL_URL: http://backend:3001
            NODE_ENV: production
        depends_on:
            backend:
                condition: service_healthy
        ports:
            - '127.0.0.1:${PREVIEW_FRONTEND_PORT:?PREVIEW_FRONTEND_PORT is required}:3000'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 20
        tmpfs:
            - /tmp
            - /app/apps/frontend/.next/cache

volumes:
    postgres-data:
    minio-data:
