name: Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_AUTHOR_NAME: Kurami CI
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: Kurami CI
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: node tests/human-docs/impact.ts
      - name: Start disposable tmux supervisor
        run: tmux new-session -d -s ci-supervisor
      - run: npm test
      - name: Remove disposable tmux supervisor
        if: always()
        run: tmux kill-session -t '=ci-supervisor' || true
