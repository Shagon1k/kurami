version: 3

# Cron-safe Composio boundary for Kurami ingestion. The hosted Session enforces
# this policy during tool discovery and execution; Hermes may therefore trust
# this connector without trusting the broader write-capable Composio Session.
toolkits:
  - gmail
  - googlecalendar
  - youtube

tools:
  gmail:
    enabled:
      - GMAIL_FETCH_EMAILS
      - GMAIL_FETCH_MESSAGE_BY_MESSAGE_ID
  googlecalendar:
    enabled:
      - GOOGLECALENDAR_EVENTS_LIST
  youtube:
    enabled:
      - YOUTUBE_GET_VIDEO_DETAILS_BATCH
      - YOUTUBE_LIST_CHANNELS
      - YOUTUBE_LIST_CHANNEL_VIDEOS
      - YOUTUBE_SEARCH_YOU_TUBE
direct_tools: true

enable_tags:
  - readOnlyHint
disable_tags:
  - destructiveHint

manage_connections: false
workbench: false
multi_account: false
require_explicit_account_selection: false
