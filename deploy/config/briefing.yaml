version: 2

edition:
  timezone: Europe/Vilnius
  daily_schedule: "0 9 * * *"
  cinema_schedule: "0 9 * * 6"
  daily_retention_days: 5
  cinema_retention: until_next_success

safety:
  production_mutations_enabled: false
  initial_channel_cleanup_confirmed: false
  require_bounded_telegram_commit: true
  gmail_generation_is_read_only: true

publication:
  latest_path: /
  daily_path_template: /daily/{local_date}
  cinema_path: /cinema
  access: cloudflare_access

notification:
  provider: discord
  destination: owner_briefing
  notify_on_release: true
  notify_on_total_failure: true

capabilities:
  renderer:
    skill: kurami-ui-preview-language
  publisher:
    provider: kurami_briefing_runtime

sources:
  calendar:
    profile: composio-google-calendar
    enabled: true
    settings:
      calendar: primary
      window: local_day
  mail:
    profile: composio-gmail
    enabled: true
    settings:
      query: "in:inbox is:unread category:primary"
      page_size: 100
  weather:
    profile: hermes-weather
    enabled: true
    settings:
      location: Vilnius, Lithuania
  news:
    profile: telegram-user
    enabled: true
    settings:
      unread_only: true
      page_size: 100
