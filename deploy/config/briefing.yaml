version: 3

edition:
  timezone: Europe/Vilnius
  daily_schedule: "0 9 * * *"
  cinema_schedule: "0 9 * * 6"
  live_refresh_schedule: "37 * * * *"
  daily_retention_days: 5
  cinema_retention: until_next_success

safety:
  production_mutations_enabled: true
  initial_channel_cleanup_confirmed: true
  require_bounded_telegram_commit: true
  gmail_generation_is_read_only: true

publication:
  latest_path: /
  daily_path_template: /daily/{local_date}
  cinema_path: /cinema
  access: cloudflare_access

notification:
  provider: discord
  destination: "1543918214835216584"
  delivery: direct
  notify_on_release: true
  notify_on_total_failure: true

capabilities:
  renderer:
    skill: kurami-ui-preview-language
  publisher:
    provider: kurami_briefing_runtime

# Native weekly add-on. Its implementation and fixture gates are complete; it
# remains inert until the live provider and credential preflight passes.
