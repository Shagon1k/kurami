version: 1

edition:
  timezone: Europe/Vilnius
  daily_schedule: "0 9 * * *"
  cinema_schedule: "0 9 * * 6"
  daily_retention_days: 5
  cinema_retention: until_next_success

safety:
  production_mutations_enabled: false
  initial_channel_cleanup_confirmed: false
  require_bounded_telegram_commit: true
  gmail_generation_is_read_only: true

publication:
  latest_path: /
  daily_path_template: /daily/{local_date}
  cinema_path: /cinema
  access: cloudflare_access

notification:
  provider: discord
  destination: owner_briefing
  notify_on_release: true
  notify_on_total_failure: true

capabilities:
  news:
    provider: telegram
    operations:
      unread_count: list_chats
      fetch_recent: get_messages
      mark_read_through: mark_as_read_with_max_id
  mail:
    provider: composio
    operations:
      list_unread: GMAIL_FETCH_EMAILS
      fetch_message: GMAIL_FETCH_MESSAGE_BY_MESSAGE_ID
      read_and_archive: GMAIL_BATCH_MODIFY_MESSAGES
  calendar:
    provider: composio
    calendar: primary
    operations:
      list_primary: GOOGLECALENDAR_EVENTS_LIST
  weather:
    provider: hermes_weather
  renderer:
    skill: kurami-ui-preview-language
  publisher:
    provider: kurami_briefing_runtime

